<!DOCTYPE html>
<html lang="id">
<head>
<title>Istilah-istilah dalam PNS | CPNS Pemkot Makassar 2024 | by Dedy A Muzawwir</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="https://makassarkota.go.id/wp-content/uploads/2024/02/logo-makassarkota-817x1024.png" type="image/png" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="assets/theme.css" />
<script src="assets/theme.js"></script>
</head>
<body>
<a id="saweria-widget" href="https://saweria.co/damz93" target="_blank" rel="noopener"><img src="https://www.pngplay.com/wp-content/uploads/12/Killua-Zoldyck-Transparent-Image.png" alt="Donasi" /> Boleh Kak Recehannya 💖</a>

<div class="wrap wide">
  <header class="hero">
    <div class="hero-in">
      <a href="../pns-pemkot-mks-2024" title="Kembali ke Menu Utama"><img src="https://makassarkota.go.id/wp-content/uploads/2024/02/logo-makassarkota-817x1024.png" alt="Logo Makassar" /></a>
      <div><h1>DAFTAR ISTILAH &amp; SINGKATAN</h1><p>Kamus informasi PNS Pemerintah Kota Makassar</p></div>
      <button class="theme-btn" data-theme-toggle title="Ganti tema" aria-label="Ganti tema"></button>
    </div>
  </header>

  <main class="panel lift">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
      <input id="q" type="search" autofocus autocomplete="off" placeholder="Cari singkatan, kategori, atau penjelasan istilah..." /></div>
    <div class="chips" id="chips"></div>
    <div class="bar"><span id="count">&nbsp;</span></div>
    <div id="state" class="state"><div class="spin"></div>Memuat istilah...</div>
    <div class="terms" id="list"></div>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, esc = PNS.esc, data = [], S = { q: '', cat: '' };

  fetch('json/istilah.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (d) {
    data = d.sort(function (a, b) { return a.singkatan.localeCompare(b.singkatan); });
    data.forEach(function (x) { x.k = (x.singkatan + ' ' + x.penjelasan + ' ' + x.kategori).toLowerCase(); });

    var cats = {}; data.forEach(function (x) { cats[x.kategori] = (cats[x.kategori] || 0) + 1; });
    $('chips').innerHTML = '<button class="chip on" data-c="">Semua (' + data.length + ')</button>' +
      Object.keys(cats).sort().map(function (c) { return '<button class="chip" data-c="' + esc(c) + '">' + esc(c) + ' (' + cats[c] + ')</button>'; }).join('');
    $('state').hidden = true; render();
  }).catch(function (e) {
    $('state').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;color:#F59E0B"></i><br><br>Gagal memuat data: ' + esc(e.message);
  });

  function render() {
    var v = S.q, out = data.filter(function (x) { return (!S.cat || x.kategori === S.cat) && (!v || x.k.indexOf(v) > -1); });
    $('count').textContent = out.length + ' istilah ditemukan';
    $('list').innerHTML = out.length ? out.map(function (x) {
      return '<article class="term"><h3>' + esc(x.singkatan) + '</h3><p>' + esc(x.penjelasan) +
             '</p><small><i class="fa-regular fa-folder-open" style="color:var(--p)"></i> ' + esc(x.kategori) + '</small></article>';
    }).join('') : '<div class="state" style="grid-column:1/-1">Tidak ada hasil ditemukan.</div>';
  }

  var tm; $('q').addEventListener('input', function () { clearTimeout(tm); var s = this.value; tm = setTimeout(function () { S.q = s.toLowerCase().trim(); render(); }, 120); });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    $('chips').querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); }); b.classList.add('on');
    S.cat = b.dataset.c; render();
  });
})();
</script>
</body>
</html>
